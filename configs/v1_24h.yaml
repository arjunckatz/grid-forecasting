contract_version: 1
target:
  name: delhi_total_demand
  unit: MW
time:
  timezone: Asia/Kolkata
  raw_frequency: 5min
  modeling_frequency: 1h
forecast:
  horizon_hours: 24
aggregation:
  method: mean
  expected_readings_per_hour: 12
  minimum_valid_readings_per_hour: 9
  minimum_coverage_fraction: 0.75
evaluation:
  primary_metric: mae_mw
  development_valid_start: "2024-04-01"
  development_valid_end: "2024-12-31"
  holdout_valid_start: "2025-01-01"
  holdout_valid_end: "2025-12-31"
  backtest_frequency: monthly
features:
  issue_lags_hours: [1, 2, 3, 6, 24, 48, 168]
  valid_lags_hours: [168]
  rolling_windows_hours: [6, 24, 168]
  rolling_minimum_fraction: 0.75
xgboost:
  model_name: xgboost_load_only
  boosting_rounds: 200
  objective: reg:squarederror
  eval_metric: mae
  tree_method: hist
  max_depth: 6
  eta: 0.05
  min_child_weight: 1.0
  subsample: 1.0
  colsample_bytree: 1.0
  seed: 42
  nthread: 1
